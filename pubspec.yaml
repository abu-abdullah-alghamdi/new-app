name: areem_clinics
description: تطبيق حجز مواعيد عيادتي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  # شريط التبويبات الأصلي من آبل (Liquid Glass على iOS 26)
  cupertino_native_better: ^2.3.1
  # مشاركة طبيب أو خدمة من قائمة المشاركة الأصلية
  share_plus: '>=11.0.0 <14.0.0'
  # إضافة الموعد لتقويم الجوال
  add_2_calendar: ^3.0.1
  # تذكير من الجوال قبل الموعد بساعة
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  # السحب على الموعد (إلغاء / تعديل)
  flutter_slidable: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/doctors/

  # الخط مدمج داخل التطبيق (ما ينزل من الإنترنت)
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
